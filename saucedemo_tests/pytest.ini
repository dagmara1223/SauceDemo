[pytest]

# Look for tests only in the tests directory
testpaths = tests

# Default pytest options (using flags)
addopts =
    -ra
    --strict-markers
    --base-url=https://www.saucedemo.com
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results

# Custom markers
markers =
    e2e: full end-to-end user journey
    negative: negative / error-handling scenario
    data: assertion on data correctness rather than element visibility