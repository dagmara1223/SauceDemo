# configuration file
[pytest]
testpaths = tests # look for tests only in test/ folder
addopts = # use flags
    -ra # tests that were skipped and why (short description)
    --strict-markers # don't allow misspelling (markers)
    --base-url=https://www.saucedemo.com # our site, page.goto("/")
    --browser=chromium # default browser
    --screenshot=only-on-failure # for debugging purposes
    --video=retain-on-failure # records and then deletes tests that passed (saves if not)
    --tracing=retain-on-failure
    --output=test-results # saves the traces
 
markers =
    anonymous: run the test without a pre-authenticated session (starts on the login page)
    e2e: full end-to-end user journey
    negative: negative / error-handling scenario
    data: assertion on data correctness rather than element visibility